name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v0.1.0); leave empty for a plain build"
        required: false
        default: ""

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}

jobs:
  core-tests:
    name: Core unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror -DGHP_BUILD_LIVE_TESTS=OFF
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        run: ./build/unit_tests

  live-linux:
    name: Live API tests (Linux, libcurl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Live tests against api.github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build/live_tests

  windows:
    name: Far plugin (Windows x64, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: build\Release\unit_tests.exe
      - name: Live tests through WinHTTP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: build\Release\live_tests.exe
      - name: Check exports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $exports = & $dumpbin.FullName /exports build\Release\GitHubPanel.dll | Out-String
          Write-Output $exports
          foreach ($name in 'GetGlobalInfoW','SetStartupInfoW','OpenW','GetFindDataW','SetDirectoryW','GetFilesW') {
            if ($exports -notmatch "\b$name\b") { throw "missing export $name" }
          }
          $deps = & $dumpbin.FullName /dependents build\Release\GitHubPanel.dll | Out-String
          Write-Output $deps
          if ($deps -match 'VCRUNTIME|MSVCP') { throw "the DLL depends on the VC++ runtime" }
      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          New-Item -ItemType Directory -Force dist\GitHubPanel | Out-Null
          Copy-Item build\Release\GitHubPanel.dll dist\GitHubPanel\
          Copy-Item docs\PLUGIN-README.txt dist\GitHubPanel\README.txt
          Compress-Archive -Path dist\GitHubPanel -DestinationPath "dist\GitHubPanel-$version-x64.zip"
          # The bare DLL and its checksum are what "Check for updates" downloads.
          Copy-Item build\Release\GitHubPanel.dll dist\GitHubPanel.dll
          $hash = (Get-FileHash dist\GitHubPanel.dll -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist\GitHubPanel.dll.sha256", "$hash  GitHubPanel.dll`n")
      - uses: actions/upload-artifact@v4
        with:
          name: GitHubPanel-x64
          path: |
            dist/*.zip
            dist/*.dll
            dist/*.sha256

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [core-tests, live-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GitHubPanel-x64
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.dll dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GitHub panel for Far $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md
